name: Publish queued English lessons

# Owner-approved (2026-10-20): fully automatic, no human review step.
# Put a lesson script (pattern beat|word|phrase|upgrade|vs, see beat-shorts/README.md) into publish-queue/scripts/NNNN-<id>.json
# and push. At each scheduled time this workflow takes the next item, renders it with
# beat-shorts/ (this repo), runs automatic gates, uploads it PUBLIC to
# the channel (ドパ英語, formerly エラーで学ぶ英語) and records it. Already-rendered videos in publish-queue/pending/
# go first. Control: publish-queue/config.json (enabled, maxPerDayJst). A failed render or gate
# moves the script to publish-queue/failed/ with the reason; a failed upload is never retried.
on:
  schedule:
    - cron: "47 2 * * *"   # 11:47 JST
    - cron: "47 10 * * *"  # 19:47 JST
  workflow_dispatch:
    inputs:
      force:
        description: publish one even if disabled or over the daily cap
        type: choice
        default: "false"
        options: ["false", "true"]
      dry_run:
        description: render the next script and keep the video as an artifact; no upload, queue untouched
        type: choice
        default: "false"
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE: ${{ github.event.inputs.force || 'false' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: What to do this run
        id: next
        run: python3 scripts/queue_next.py | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.next.outputs.kind != 'none'
        with:
          node-version: '20'
          cache: npm
      - if: steps.next.outputs.kind != 'none'
        run: npm ci
      # Check YouTube auth BEFORE rendering: with an expired refresh token every run used to
      # render, fail the upload and consume a script. Failing here leaves the queue untouched.
      - name: YouTube auth preflight
        if: steps.next.outputs.kind != 'none' && env.DRY_RUN != 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npx tsx scripts/youtube-preflight.ts

      # Every lesson pattern renders here with beat-shorts (three.js + beat map + Kokoro voice).
      # Animation Factory is no longer used (owner decision 2026-11-01).
      - uses: actions/setup-python@v5
        if: steps.next.outputs.kind == 'script'
        with:
          python-version: "3.12"
      - name: Cache Kokoro voice model
        if: steps.next.outputs.kind == 'script'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0-int8
      - name: Render the Short
        id: beat
        if: steps.next.outputs.kind == 'script'
        shell: bash
        run: |
          set -euo pipefail
          file="${{ steps.next.outputs.file }}"
          python3 scripts/beat_to_request.py check "$file"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet numpy soundfile==0.14.0 kokoro-onnx==0.6.1
          cd beat-shorts
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          mkdir -p out
          node render.js "../publish-queue/scripts/$file" "out/video.mp4"
          cd ..
          python3 scripts/beat_to_request.py request "$file" beat-shorts/out/video.mp4
          echo "request=${file%.json}.request.json" >> "$GITHUB_OUTPUT"
      - name: Park a script that failed to render or pass the gates
        if: failure() && steps.next.outputs.kind == 'script' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          mkdir -p publish-queue/failed
          file="${{ steps.next.outputs.file }}"
          [ -f "publish-queue/scripts/$file" ] && git mv "publish-queue/scripts/$file" "publish-queue/failed/$file"
          { echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; cat gate-failure.txt 2>/dev/null || echo "render failed (see run log)"; } > "publish-queue/failed/${file%.json}.reason.txt"
      - name: Keep review files of the render
        if: always() && steps.next.outputs.kind == 'script'
        uses: actions/upload-artifact@v4
        with:
          name: lesson-render-${{ github.run_id }}
          path: |
            beat-shorts/out/*.sheet.jpg
            beat-shorts/out/*.style.json
            ${{ env.DRY_RUN == 'true' && 'beat-shorts/out/video.mp4' || '' }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload to the channel (public)
        if: steps.next.outputs.kind != 'none' && env.DRY_RUN != 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ONLY_FILE: ${{ steps.next.outputs.kind == 'video' && steps.next.outputs.file || steps.beat.outputs.request }}
          FORCE: "true"   # the guards were applied by queue_next.py
        run: npx tsx scripts/publish-queue.ts

      - name: Record the queue state
        if: always() && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          rm -rf beat-shorts/out beat-shorts/node_modules beat-shorts/.job
          git add -A publish-queue
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "publish-queue: ${{ steps.next.outputs.kind }} ${{ steps.next.outputs.file }} [skip ci]"
          git pull --rebase -q || true
          git push
