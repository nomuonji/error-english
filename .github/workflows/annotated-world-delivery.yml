name: Annotated World delivery
on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - 'scripts/annotated-world-delivery.ts'
      - 'scripts/prepare-annotated-world.py'
      - 'scripts/queue_next.py'
      - 'scripts/publish-queue.ts'
      - 'publish-queue/config.json'
      - '.github/workflows/annotated-world-delivery.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify, prepare, upload-private]
        default: verify
      source_sha:
        description: 'prepare: full reviewed commit SHA in The-Annotated-World'
        type: string
      clip_id:
        description: 'prepare: productions/<clip-id>'
        type: string
      artifact_run_id:
        description: 'upload-private: successful prepare run ID in this repository'
        type: string
      expected_sha256:
        description: 'upload-private: reviewed MP4 exact SHA256'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: annotated-world-delivery
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: python3 -m py_compile scripts/prepare-annotated-world.py scripts/queue_next.py
      - name: Confirm retired queue cannot be forced
        run: |
          FORCE=true python3 scripts/queue_next.py | tee /tmp/queue.out
          grep -Fx 'kind=none' /tmp/queue.out
          grep -Fx 'reason=legacy queue retired; force disabled' /tmp/queue.out
          FORCE=true npx tsx scripts/publish-queue.ts | grep -F 'Legacy queue retired; force disabled.'
      - name: Compile delivery scripts without credentials
        run: |
          npx --no-install esbuild scripts/annotated-world-delivery.ts --platform=node --bundle --packages=external --outfile=/tmp/aw-delivery.js
          npx --no-install esbuild scripts/publish-aw001-reviewed.ts --platform=node --bundle --packages=external --outfile=/tmp/aw001-public.js
          node --check scripts/prepare-aw001-reviewed.mjs
          node --check scripts/review-aw001-gemini.mjs
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLIP_ID: ${{ inputs.clip_id }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$CLIP_ID" =~ ^[A-Za-z0-9_-]+$ ]]
      - uses: actions/checkout@v4
        with:
          repository: nomuonji/The-Annotated-World
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core
      - run: pip install pillow numpy pydub
      - name: Render reviewed source, no OAuth
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLIP_ID: ${{ inputs.clip_id }}
        run: python3 scripts/prepare-annotated-world.py source "$CLIP_ID" "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: annotated-world-delivery
          path: aw-delivery/
          if-no-files-found: error
          retention-days: 14
  delivery:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'prepare' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Validate artifact source workflow
        if: inputs.mode == 'upload-private'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" | jq -e '.conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/annotated-world-delivery.yml"'
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'upload-private'
        with:
          name: annotated-world-delivery
          path: aw-delivery
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Verify original channel / private upload only
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npx tsx scripts/annotated-world-delivery.ts "$MODE" aw-delivery
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'upload-private'
        with:
          name: annotated-world-receipt
          path: aw-delivery/receipt.json
          if-no-files-found: ignore

  verify-owner-comment:
    # Read-only identity verification. No media or upload; only the authenticated owner can invoke.
    if: github.event_name == 'issue_comment' && github.event.comment.user.id == 63096515 && github.event.comment.body == '/aw-verify-channel' && github.event.issue.pull_request == null && github.event.issue.user.id == 63096515
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Read-only OAuth verification
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set +e
          npx tsx scripts/annotated-world-delivery.ts verify >/tmp/aw-verify.json 2>/tmp/aw-verify-error
          rc=$?
          if [ "$rc" -eq 0 ] && jq -e '(.channelId | type == "string") and .verifiedAgainst == "7u0H0AkkLD4"' /tmp/aw-verify.json >/dev/null; then
            jq -c '{channelId,title,verifiedAgainst}' /tmp/aw-verify.json >/tmp/aw-verify-result
          else
            printf '%s\n' '{"status":"failed","detail":"OAuth identity verification failed. Inspect restricted workflow execution; no upload performed."}' >/tmp/aw-verify-result
          fi
      - name: Record verification receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          { printf 'Read-only Annotated World channel verification (run %s):\n\n' "$GITHUB_RUN_ID"; cat /tmp/aw-verify-result; printf '\nNo video uploaded.\n'; } >/tmp/aw-verify-comment
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/aw-verify-comment

  release-owner-comment:
    # Only the authenticated owner comment on the existing owner-created identity issue.
    # The production ledger AND exact MP4 digest must pass review before ANY upload.
    if: ${{ github.event_name == 'issue_comment' && github.event.comment.user.id == 63096515 && github.event.issue.user.id == 63096515 && github.event.issue.number == 31 && github.event.issue.pull_request == null && github.event.comment.body == '/aw-release-001' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Acquire reviewed artifact and enforce all publication gates
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-aw001-reviewed.mjs
      - name: Existing OAuth — private upload and readback only
        env:
          EXPECTED_SHA256: '194c6a7ba04ecf056fe070b8fdebc3faee4d9db107f4ce68c3590951d6aee9ac'
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npx tsx scripts/annotated-world-delivery.ts upload-private aw-delivery
      - name: Public switch of the same private ID with real YouTube readback
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npx tsx scripts/publish-aw001-reviewed.ts aw-delivery
      - name: Preserve receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aw001-publication-receipt
          path: aw-delivery/receipt.json
          if-no-files-found: error
      - name: Post real YouTube ID and privacy to owner tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'AW-001 YouTube release verified by API (run %s):\n\n' "$GITHUB_RUN_ID" >/tmp/aw001-release-message
          jq -r '"Video ID: " + .videoId, "Privacy: " + .privacy, "URL: " + .watchUrl, "SHA256: " + .sha256' aw-delivery/receipt.json >>/tmp/aw001-release-message
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file /tmp/aw001-release-message

  review-owner-comment:
    # Read-only video/audio review; separate from publication permission.
    if: ${{ github.event_name == 'issue_comment' && github.event.comment.user.id == 63096515 && github.event.issue.user.id == 63096515 && github.event.issue.number == 31 && github.event.issue.pull_request == null && github.event.comment.body == '/aw-review-001' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Download exact MP4 review artifact (no upload)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/nomuonji/The-Annotated-World/actions/artifacts/14897427515/zip" --output /tmp/aw001-review.zip
          mkdir -p /tmp/aw001-review
          unzip -oq /tmp/aw001-review.zip -d /tmp/aw001-review
          echo "194c6a7ba04ecf056fe070b8fdebc3faee4d9db107f4ce68c3590951d6aee9ac  /tmp/aw001-review/annotated-short.mp4" | sha256sum -c
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gemini actual audiovisual QA (no publication)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/review-aw001-gemini.mjs /tmp/aw001-review/annotated-short.mp4 /tmp/aw001-review/captions.srt
      - uses: actions/upload-artifact@v4
        with:
          name: aw001-gemini-media-audit
          path: aw001-gemini-media-audit.json
          if-no-files-found: error
      - name: Record result for editor's real review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { printf 'AW-001 perceptual MP4 QA (run %s):\n\n' "$GITHUB_RUN_ID"; jq -r '"Audio perceptible: " + (.canPerceiveAudio|tostring), "All 25 cues checked: " + (.checkedAllCues|tostring), "Verdict: " + .overall, "Summary: " + .summaryJapanese, "Major issues: " + (.majorIssues|tojson), "Minor issues: " + (.minorIssues|tojson)' aw001-gemini-media-audit.json; printf '\nNo public/private upload or editorial approval performed.\n'; } >/tmp/aw001-audit-message
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file /tmp/aw001-audit-message

  resume-existing-aw001:
    # Recover the EXACT previously uploaded private video; NEVER call videos.insert here.
    # This job follows a verified upload receipt from run 45423026831, video hYPNkPfJbOQ.
    if: ${{ github.event_name == 'issue_comment' && github.event.comment.user.id == 63096515 && github.event.issue.user.id == 63096515 && github.event.issue.number == 31 && github.event.issue.pull_request == null && github.event.comment.body == '/aw-resume-public-001' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Rebuild exact reviewed delivery manifest, no OAuth/no video upload
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-aw001-reviewed.mjs
      - name: Pin already existing YouTube ID from successful private upload readback
        run: |
          jq --arg id "hYPNkPfJbOQ" --arg ch "UCBy9F1fD4SQTyjTK8yfZGhA" '{clipId,sourceSha,sha256,videoId:$id,channelId:$ch,privacy:"private"}' aw-delivery/delivery.json >aw-delivery/receipt.json
      - name: Verify existing video matches clip and SHA, then set PUBLIC and read back
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npx tsx scripts/publish-aw001-reviewed.ts aw-delivery
      - name: Preserve observed existing-video receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aw001-existing-video-receipt
          path: aw-delivery/receipt.json
          if-no-files-found: ignore
      - name: Report actual PUBLIC status on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'AW-001 existing uploaded video final API readback (run %s):\n\n' "$GITHUB_RUN_ID" >/tmp/aw001-public-message
          jq -r '"Video ID: "+.videoId, "Privacy: "+.privacy, "URL: "+.watchUrl, "SHA256: "+.sha256' aw-delivery/receipt.json >>/tmp/aw001-public-message
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file /tmp/aw001-public-message
