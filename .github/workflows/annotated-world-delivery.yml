name: Annotated World delivery
on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - 'scripts/annotated-world-delivery.ts'
      - 'scripts/prepare-reviewed-delivery.mjs'
      - 'scripts/publish-reviewed.ts'
      - 'scripts/prepare-annotated-world.py'
      - 'scripts/queue_next.py'
      - 'scripts/publish-queue.ts'
      - 'publish-queue/config.json'
      - '.github/workflows/annotated-world-delivery.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify, prepare, upload-private, release-reviewed]
        default: verify
      source_sha:
        description: 'prepare: full reviewed commit SHA in The-Annotated-World'
        type: string
      clip_id:
        description: 'prepare/release-reviewed: productions/<clip-id>'
        type: string
      artifact_run_id:
        description: 'upload-private: successful prepare run ID in this repository'
        type: string
      expected_sha256:
        description: 'upload-private: reviewed MP4 exact SHA256'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: annotated-world-delivery
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: python3 -m py_compile scripts/prepare-annotated-world.py scripts/queue_next.py
      - name: Confirm retired queue cannot be forced
        run: |
          FORCE=true python3 scripts/queue_next.py | tee /tmp/queue.out
          grep -Fx 'kind=none' /tmp/queue.out
          grep -Fx 'reason=legacy queue retired; force disabled' /tmp/queue.out
          FORCE=true npx tsx scripts/publish-queue.ts | grep -F 'Legacy queue retired; force disabled.'
      - name: Compile delivery scripts without credentials
        run: |
          npx --no-install esbuild scripts/annotated-world-delivery.ts --platform=node --bundle --packages=external --outfile=/tmp/aw-delivery.js
          npx --no-install esbuild scripts/publish-aw001-reviewed.ts --platform=node --bundle --packages=external --outfile=/tmp/aw001-public.js
          node --check scripts/prepare-aw001-reviewed.mjs
          node --check scripts/review-aw001-gemini.mjs
          node --check scripts/prepare-reviewed-delivery.mjs
          npx --no-install esbuild scripts/publish-reviewed.ts --platform=node --bundle --packages=external --outfile=/tmp/aw-publish-reviewed.js
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLIP_ID: ${{ inputs.clip_id }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$CLIP_ID" =~ ^[A-Za-z0-9_-]+$ ]]
      - uses: actions/checkout@v4
        with:
          repository: nomuonji/The-Annotated-World
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core
      - run: pip install pillow numpy pydub
      - name: Render reviewed source, no OAuth
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLIP_ID: ${{ inputs.clip_id }}
        run: python3 scripts/prepare-annotated-world.py source "$CLIP_ID" "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: annotated-world-delivery
          path: aw-delivery/
          if-no-files-found: error
          retention-days: 14
  delivery:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'verify' || inputs.mode == 'upload-private') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Validate artifact source workflow
        if: inputs.mode == 'upload-private'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" | jq -e '.conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/annotated-world-delivery.yml"'
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'upload-private'
        with:
          name: annotated-world-delivery
          path: aw-delivery
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Verify original channel / private upload only
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npx tsx scripts/annotated-world-delivery.ts "$MODE" aw-delivery
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'upload-private'
        with:
          name: annotated-world-receipt
          path: aw-delivery/receipt.json
          if-no-files-found: ignore

  verify-owner-comment:
    # Read-only identity verification. No media or upload; only the authenticated owner can invoke.
    if: github.event_name == 'issue_comment' && github.event.comment.user.id == 63096515 && github.event.comment.body == '/aw-verify-channel' && github.event.issue.pull_request == null && github.event.issue.user.id == 63096515
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Read-only OAuth verification
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set +e
          npx tsx scripts/annotated-world-delivery.ts verify >/tmp/aw-verify.json 2>/tmp/aw-verify-error
          rc=$?
          if [ "$rc" -eq 0 ] && jq -e '(.channelId | type == "string") and .verifiedAgainst == "7u0H0AkkLD4"' /tmp/aw-verify.json >/dev/null; then
            jq -c '{channelId,title,verifiedAgainst}' /tmp/aw-verify.json >/tmp/aw-verify-result
          else
            printf '%s\n' '{"status":"failed","detail":"OAuth identity verification failed. Inspect restricted workflow execution; no upload performed."}' >/tmp/aw-verify-result
          fi
      - name: Record verification receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          { printf 'Read-only Annotated World channel verification (run %s):\n\n' "$GITHUB_RUN_ID"; cat /tmp/aw-verify-result; printf '\nNo video uploaded.\n'; } >/tmp/aw-verify-comment
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/aw-verify-comment

  release-reviewed:
    # Explicit owner action + episode-specific ledger permission, quote rights, and exact-media QA.
    # Issue #31 is the persistent authenticated command inbox; no approval is inferred from a comment alone.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-reviewed' && github.ref == 'refs/heads/main' && github.actor == 'nomuonji') || (github.event_name == 'issue_comment' && github.event.comment.user.id == 63096515 && github.event.issue.user.id == 63096515 && github.event.issue.number == 31 && github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/aw-release ')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Validate episode input (never interpolate issue text into shell)
        env:
          EVENT_KIND: ${{ github.event_name }}
          COMMAND: ${{ github.event.comment.body }}
          DISPATCH_CLIP: ${{ inputs.clip_id }}
        run: |
          if [[ "$EVENT_KIND" == "issue_comment" ]]; then
            [[ "$COMMAND" =~ ^/aw-release[[:space:]](aw-[0-9]{3}-[a-z0-9-]+)$ ]] || { echo "Invalid release comment"; exit 1; }
            CLIP_ID="${BASH_REMATCH[1]}"
          else
            CLIP_ID="$DISPATCH_CLIP"
            [[ "$CLIP_ID" =~ ^aw-[0-9]{3}-[a-z0-9-]+$ ]] || { echo "Invalid release clip ID"; exit 1; }
          fi
          echo "CLIP_ID=$CLIP_ID" >>"$GITHUB_ENV"
      - name: Validate source rights, owner permission, exact reviewed MP4 and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/prepare-reviewed-delivery.mjs "$CLIP_ID"
          echo "EXPECTED_SHA256=$(jq -r '.sha256' aw-delivery/delivery.json)" >>"$GITHUB_ENV"
      - name: Upload PRIVATE or recover matching existing ID (never duplicate)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npx tsx scripts/annotated-world-delivery.ts upload-private aw-delivery
      - name: Persist private upload receipt BEFORE public switch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { printf 'Annotated World delivery checkpoint (run %s):\n' "$GITHUB_RUN_ID";
            jq -r '"Clip: "+.clipId, "Video ID: "+.videoId, "Privacy at checkpoint: "+(.privacy//"unknown"), "MP4 SHA256: "+.sha256' aw-delivery/receipt.json;
            printf 'Public readback NOT yet confirmed. Reuse this ID; do not re-upload if later steps fail.\n'; } >/tmp/aw-private-receipt
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file /tmp/aw-private-receipt
      - name: Publish exact existing ID and poll authoritative YouTube privacy
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npx tsx scripts/publish-reviewed.ts aw-delivery
      - name: Always preserve the current receipt for safe retry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annotated-world-episode-receipt
          path: aw-delivery/receipt.json
          if-no-files-found: ignore
      - name: Report verified public video ID and privacy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { printf 'Annotated World PUBLIC release verified (run %s):\n' "$GITHUB_RUN_ID";
            jq -r '"Clip: "+.clipId, "Video ID: "+.videoId, "Privacy: "+.privacy, "URL: "+.watchUrl, "MP4 SHA256: "+.sha256, "Source revision: "+.sourceSha' aw-delivery/receipt.json; } >/tmp/aw-public-receipt
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file /tmp/aw-public-receipt
      - name: Record failed release without claiming upload success
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Annotated World delivery incomplete (run %s, clip %s). Inspect step logs and saved receipt. Do NOT re-upload until the existing video ID/privacy is checked.\n' "$GITHUB_RUN_ID" "$CLIP_ID" >/tmp/aw-failure
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file /tmp/aw-failure
