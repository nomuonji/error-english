name: Validate queue specs (My Portal generates content)

on:
  pull_request:
    paths:
      - "scripts/beat_to_request.py"
      - "scripts/content_ledger.py"
      - "publish-queue/scripts/**"
      - "tests/**"
      - ".github/workflows/replenish-queue.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile queue validators
        run: python3 -m py_compile scripts/beat_to_request.py scripts/content_ledger.py
      - name: Run storyboard format tests
        run: python3 -m unittest tests/test_storyboard_format.py -v
