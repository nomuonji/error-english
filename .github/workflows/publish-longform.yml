name: Publish queued long-form lessons

# Owner-requested (2026-10-20): long-form vocabulary episodes are also fully automatic.
# Put a long-form lesson script (Animation Factory lesson spec, pattern "review") into
# publish-queue/longform/NNNN-<id>.json and push. Once a week this workflow takes the oldest
# one, renders it at 1080p with nomuonji/animation-factory (public, read-only), runs automatic
# gates and uploads it PUBLIC to the channel. It has its own weekly slot (not the Shorts daily cap).
# Stop it with "longformEnabled": false in publish-queue/config.json. Failed scripts move to
# publish-queue/failed/ with the reason; uploads are never retried.
on:
  schedule:
    - cron: "17 11 * * 6"   # Saturday 20:17 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: What to do this run
        id: next
        shell: bash
        run: |
          enabled=$(python3 -c "import json;print(json.load(open('publish-queue/config.json')).get('longformEnabled', True))")
          file=$(ls publish-queue/longform/*.json 2>/dev/null | sort | head -n 1 | xargs -r -n1 basename)
          if [ "$enabled" != "True" ]; then file=""; echo "long-form publishing disabled"; fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "next: ${file:-none}"

      - name: Check out Animation Factory (read-only)
        if: steps.next.outputs.file != ''
        uses: actions/checkout@v4
        with:
          repository: nomuonji/animation-factory
          path: af
      - uses: actions/setup-python@v5
        if: steps.next.outputs.file != ''
        with:
          python-version: "3.12"
      - name: Media dependencies and voices
        if: steps.next.outputs.file != ''
        run: |
          git -C af rev-parse HEAD > af/.sha
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install --quiet numpy pillow opencv-python-headless kokoro-onnx==0.6.1 soundfile==0.14.0
          docker run -d --rm --name vv -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done; docker logs vv; exit 1
      - name: Render the long-form lesson (1080p)
        id: render
        if: steps.next.outputs.file != ''
        shell: bash
        run: |
          set -euo pipefail
          file="${{ steps.next.outputs.file }}"
          id=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "publish-queue/longform/$file")
          [[ "$id" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]] || { echo "bad id" > gate-failure.txt; exit 3; }
          cp "publish-queue/longform/$file" "af/lessons/$id.json"
          cd af
          python tools/shorts/shorts.py lesson "lessons/$id.json"
          python tools/longform/longform.py check "productions/$id/longform.json"
          python tools/longform/longform.py lock "productions/$id/longform.json"
          python tools/longform/longform.py render "productions/$id/longform.json" --profile final
          cd ..
          python3 scripts/longform_to_request.py "$file" af
          echo "request=${file%.json}.request.json" >> "$GITHUB_OUTPUT"
      - name: Park a script that failed to render or pass the gates
        if: failure() && steps.next.outputs.file != ''
        shell: bash
        run: |
          mkdir -p publish-queue/failed
          file="${{ steps.next.outputs.file }}"
          [ -f "publish-queue/longform/$file" ] && git mv "publish-queue/longform/$file" "publish-queue/failed/$file"
          { echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; cat gate-failure.txt 2>/dev/null || echo "render failed (see run log)"; } > "publish-queue/failed/${file%.json}.reason.txt"
      - name: Keep review files of the render
        if: always() && steps.next.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: longform-render-${{ github.run_id }}
          path: |
            af/outputs/longform/*/final/report.json
            af/outputs/longform/*/final/chapters.txt
            af/outputs/longform/*/final/captions.srt
            af/outputs/longform/*/final/chapters/*/contact-sheet.jpg
          retention-days: 30

      - uses: actions/setup-node@v4
        if: steps.render.outputs.request != ''
        with:
          node-version: '20'
          cache: npm
      - if: steps.render.outputs.request != ''
        run: npm ci
      - name: Upload to the channel (public)
        if: steps.render.outputs.request != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ONLY_FILE: ${{ steps.render.outputs.request }}
          FORCE: "true"
          IGNORE_DAILY_CAP: "true"
        run: npx tsx scripts/publish-queue.ts

      - name: Record the queue state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          rm -rf af
          git add -A publish-queue
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "publish-queue: long-form ${{ steps.next.outputs.file }} [skip ci]"
          git pull --rebase -q || true
          git push
