<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Rounded"; font-weight: 800; src: url(./node_modules/@fontsource/m-plus-rounded-1c/files/m-plus-rounded-1c-japanese-800-normal.woff2) format("woff2"); }
@font-face { font-family: "Rounded"; font-weight: 800; src: url(./node_modules/@fontsource/m-plus-rounded-1c/files/m-plus-rounded-1c-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
@font-face { font-family: "Rounded"; font-weight: 700; src: url(./node_modules/@fontsource/m-plus-rounded-1c/files/m-plus-rounded-1c-japanese-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 900; src: url(./node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2) format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 800; src: url(./node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2) format("woff2"); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
body { font-family: "Rounded", sans-serif; color: var(--ink); }
#bg { position: absolute; inset: 0; }
.en { font-family: "Nunito", "Rounded", sans-serif; font-weight: 900; }
#top { position: absolute; top: 150px; left: 0; right: 0; text-align: center; }
#brand { font-weight: 800; font-size: 34px; letter-spacing: 6px; color: var(--ink); opacity: .55; }
#dots { margin-top: 26px; display: flex; gap: 22px; justify-content: center; }
#dots i { width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.12); display: block; transition: none; }
#dots i.on { background: var(--a1); transform: scale(1.25); }
#dots i.done { background: var(--a2); }
.title { position: absolute; left: 80px; right: 80px; top: 640px; text-align: center; font-weight: 800; font-size: 108px; line-height: 1.2; color: var(--ink); opacity: 0; }
.title small { display: block; font-size: 54px; margin-top: 30px; color: var(--a1); }
#stage { position: absolute; left: 90px; top: 430px; width: 900px; height: 720px; perspective: 2200px; }
.card { position: absolute; inset: 0; transform-style: preserve-3d; opacity: 0; }
.face { position: absolute; inset: 0; border-radius: 56px; backface-visibility: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.18), 0 6px 0 rgba(0,0,0,.08);
        display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 60px; box-sizing: border-box; text-align: center; }
.front { background: #fff; }
.back { background: var(--a1); color: #fff; transform: rotateY(180deg); }
.chip { position: absolute; top: 34px; left: 40px; font-family: "Nunito"; font-weight: 900; font-size: 44px; color: #fff; background: var(--ink); border-radius: 999px; padding: 4px 28px; }
.back .chip { background: rgba(255,255,255,.25); }
.label { font-weight: 800; font-size: 46px; color: var(--a1); margin-bottom: 26px; }
.back .label { color: rgba(255,255,255,.85); }
.qmain { font-weight: 800; font-size: 104px; line-height: 1.15; color: var(--ink); }
.qmain.en { font-size: 112px; }
.qsub { font-weight: 700; font-size: 44px; color: #8a8f99; margin-top: 22px; }
.qsub .opt { display: inline-block; font-family: "Nunito"; font-weight: 900; color: var(--ink); background: var(--a3); border-radius: 18px; padding: 4px 24px; margin: 0 10px; }
.amain { font-weight: 800; font-size: 92px; line-height: 1.18; }
.amain.en { font-size: 96px; }
.asub { font-weight: 700; font-size: 46px; margin-top: 24px; opacity: .92; }
.amain .hl, .bubble .hl { background: rgba(255,255,255,.28); border-radius: 14px; padding: 0 12px; }
#timer { position: absolute; left: 50%; top: 1190px; width: 150px; height: 150px; margin-left: -75px; opacity: 0; }
#timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
#timer .n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Nunito"; font-weight: 900; font-size: 72px; color: var(--ink); }
.bubble { position: absolute; left: 110px; right: 110px; top: 1210px; text-align: center; background: #fff; border-radius: 40px; padding: 30px 44px; box-shadow: 0 16px 34px rgba(0,0,0,.14); opacity: 0; }
.bubble:before { content: ""; position: absolute; top: -26px; left: 90px; border: 26px solid transparent; border-bottom-color: #fff; border-top: 0; }
.bubble .ex { font-family: "Nunito"; font-weight: 800; font-size: 50px; line-height: 1.3; color: var(--ink); }
.bubble .ex .hl { background: var(--a3); }
.bubble .ja { font-weight: 700; font-size: 38px; color: #6b7280; margin-top: 12px; }
.bubble .w { display: inline-block; white-space: pre; }
#mascot { position: absolute; right: 150px; top: 1270px; width: 300px; opacity: 0; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="top"><div id="brand">ドパ英語</div><div id="dots"></div></div>
<div id="stage"></div>
<div id="timer"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="rgba(0,0,0,.08)" stroke-width="10"/><circle id="arc" cx="50" cy="50" r="44" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="n"></div></div>
<img id="mascot" alt="">
<div id="flash"></div>
<script type="module" src="card.js"></script>
</body>
</html>
